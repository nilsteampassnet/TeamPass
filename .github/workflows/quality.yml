name: Quality

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: openssl, mysqli, mbstring, bcmath, iconv, xml, gd, curl, gmp, ldap, sqlite3, zip

jobs:
  autoloader-guard:
    name: Committed autoloader is production-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Shipping the *dev* Composer autoloader fatals every installation (the bug 3.2.1.7
      # had to fix). `composer install` rewrites app/vendor/composer/ into its dev form,
      # so a contributor who forgets `git checkout -- app/vendor/composer/` before
      # committing would break every deployment. This guard catches that in review.
      - name: Verify app/vendor/composer/ is the production autoloader
        run: |
          set -euo pipefail
          if [ ! -f app/vendor/composer/installed.json ]; then
            echo "::error::app/vendor/composer/installed.json is missing from the repository."
            exit 1
          fi
          dev=$(python3 -c "import json,sys; print(json.load(open('app/vendor/composer/installed.json')).get('dev'))")
          if [ "$dev" != "False" ]; then
            echo "::error file=app/vendor/composer/installed.json::The committed autoloader is in DEV form (dev=$dev). Run 'git checkout -- app/vendor/composer/' and commit again — shipping the dev autoloader fatals every installation."
            exit 1
          fi
          if python3 -c "
          import json, sys
          names = {p['name'] for p in json.load(open('app/vendor/composer/installed.json'))['packages']}
          dev = {p['name'] for p in json.load(open('composer.lock')).get('packages-dev', [])}
          sys.exit(0 if names & dev else 1)
          "; then
            echo "::error file=app/vendor/composer/installed.json::Dev packages (composer.lock packages-dev) are listed in the committed autoloader. Restore it with 'git checkout -- app/vendor/composer/'."
            exit 1
          fi
          echo "OK — committed autoloader is production-only."

  table-prefix-guard:
    name: Table names use prefixTable()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # TeamPass lets the administrator pick a table prefix at install time. A query that
      # writes "teampass_items" literally hits a missing table on every installation using
      # another prefix, and db_error_handler() throws an uncaught exception that aborts the
      # whole page — that is issue #5347, where the Tools page lost half of its tools.
      - name: Verify no hard-coded "teampass_" table name
        run: php .github/scripts/check_table_prefix.php

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      # The dev dependencies are untracked, and the committed app/vendor/composer/ is the
      # production autoloader that maps no dev package. Removing the three directories is a
      # no-op on a clean CI checkout but mirrors the documented local recovery, and
      # `composer install` rewrites app/vendor/composer/ into the dev form the tools need.
      - name: Repair the dev toolchain
        run: |
          rm -rf app/vendor/phpstan/phpstan app/vendor/phpunit app/vendor/symfony/cache
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run the test suite
        run: php app/vendor/phpunit/phpunit/phpunit --colors=never

  javascript-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run JavaScript regression tests
        run: node --test tests/JavaScript/*.test.cjs

  static-analysis:
    name: PHPStan (level 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Repair the dev toolchain
        run: |
          rm -rf app/vendor/phpstan/phpstan app/vendor/phpunit app/vendor/symfony/cache
          composer install --no-interaction --no-progress --prefer-dist

      # phpstan.neon bootstraps app/config/settings.php, which is never committed
      # (it holds the database credentials). The sample defines the same constants
      # with empty values and opens no connection.
      - name: Provide a placeholder settings.php
        run: cp app/config/settings.sample.php app/config/settings.php

      - name: Run PHPStan
        run: php app/vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github

  secure-send-concurrency:
    name: Database integration tests (MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
          MARIADB_DATABASE: teampass_test_secure_send
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, mysqli, mbstring, curl, zip, gmp
          coverage: none
      - name: Exercise real transactions and concurrent recipients
        env:
          TEAMPASS_TEST_DB: teampass_test_secure_send
          TEAMPASS_TEST_PASSWORD: test-only-password
        run: php tests/Integration/secure_send_database.php
      - name: Check activity queries with mixed collations
        env:
          TEAMPASS_TEST_DB: teampass_test_secure_send
          TEAMPASS_TEST_PASSWORD: test-only-password
        run: php tests/Integration/admin_activity_database.php

      - name: Check knowledge base date installation and migration
        env:
          TEAMPASS_TEST_DB: teampass_test_secure_send
          TEAMPASS_TEST_PASSWORD: test-only-password
        run: php tests/Integration/kb_dates_database.php
      - name: Check the LAPR endpoint lifecycle
        env:
          TEAMPASS_TEST_DB: teampass_test_secure_send
          TEAMPASS_TEST_PASSWORD: test-only-password
        run: php tests/Integration/lapr_endpoint_lifecycle_database.php

      - name: Exercise external device authentication and revocation races
        env:
          TEAMPASS_TEST_DB: teampass_test_secure_send
          TEAMPASS_TEST_PASSWORD: test-only-password
        run: php tests/Integration/api_device_credentials_database.php
      - name: Exercise external device pairing and concurrent handoffs
        env:
          TEAMPASS_TEST_DB: teampass_test_secure_send
          TEAMPASS_TEST_PASSWORD: test-only-password
        run: php tests/Integration/device_pairing_database.php

      - name: Restore, upgrade and activate encrypted disaster recovery packages
        env:
          TEAMPASS_RECOVERY_TEST_PORT: '3306'
          TEAMPASS_RECOVERY_TEST_USER: root
          TEAMPASS_RECOVERY_TEST_PASSWORD: test-only-password
        run: |
          set -euo pipefail
          # Activation writes a real configuration: use an explicitly disposable
          # checkout, never the checkout used by the remaining quality checks.
          drp_checkout=$(mktemp -d)
          trap 'rm -rf -- "$drp_checkout"' EXIT
          git archive HEAD | tar -x -C "$drp_checkout"
          mkdir -p "$drp_checkout/_tools"
          touch "$drp_checkout/_tools/drp-lab-allow-activation"
          cd "$drp_checkout"
          php tests/Fixtures/recovery_database.php current
          php tests/Fixtures/recovery_database.php upgrade
          php tests/Integration/recovery_http.php
          php tests/Fixtures/recovery_database.php http-publish
