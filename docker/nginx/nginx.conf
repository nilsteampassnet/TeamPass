user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Query strings carry secrets (Secure Send link credentials, reset tokens,
    # download keys), and so does the Referer of a page holding them: log the
    # path without its query string, and no Referer.
    map $request_uri $teampass_log_path {
        default                       $request_uri;
        "~^(?<teampass_path>[^?]*)\?" $teampass_path;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $teampass_log_path $server_protocol" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Default only: a page sending its own policy (Secure Send, password reset
    # and API send no-referrer) keeps it. A second header would override it,
    # browsers apply the last one.
    map $upstream_http_referrer_policy $teampass_referrer_policy {
        ""      "strict-origin-when-cross-origin";
        default "";
    }
    add_header Referrer-Policy $teampass_referrer_policy always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/x-javascript application/atom+xml image/svg+xml;

    # Include virtual hosts
    include /etc/nginx/http.d/*.conf;
}
